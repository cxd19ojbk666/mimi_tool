<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light">
<title>咪咪大王做表格</title>
<link rel="icon" href="../../../assets/mimi-toolbox-transparent.ico">
<link rel="stylesheet" href="../styles/mimi-ui.css?v=5">
<link rel="stylesheet" href="../styles/mimi-table.css?v=2">
</head>
<body data-mimi-tool="table-maker"><div class="shell">
<header><div class="brand"><div><h1>咪咪大王做表格</h1><p>咪的汪给咪做的表格工具</p></div></div><div class="top-actions"><a class="btn" href="../index.html">首页</a></div></header>

<div class="task-switcher">
  <div class="task-grid" role="group" aria-label="选择表格任务">
    <button class="task-button active" type="button" data-mode="match" aria-pressed="true">合并表格</button>
    <button class="task-button" type="button" data-mode="compare" aria-pressed="false">核对名单</button>
    <button class="task-button" type="button" data-mode="clean" aria-pressed="false">清理数据</button>
    <button class="task-button" type="button" data-mode="grade" aria-pressed="false">成绩分析</button>
  </div>
  <p id="taskDescription">按姓名或学号，把多张表的内容合到一起</p>
</div>

<main class="workspace" id="workspace" data-mobile-panel="setup">
  <section class="panel left-panel left is-mobile-active" id="leftPanel" data-workspace-panel="left" data-mobile-panel-name="setup">
    <div class="panel-head"><h2>任务设置</h2><div class="panel-head-actions"><button class="quiet-action" id="clearAll" type="button" title="清空当前数据和结果">清空</button><button class="panel-collapse" id="hideLeft" title="隐藏任务设置" aria-label="隐藏任务设置">−</button></div></div>
    <div class="panel-body">
      <section class="section task-source stack">
        <div class="step-head"><span class="step-index">1</span><strong>添加数据</strong></div>
        <div class="source-actions"><button class="btn upload" id="uploadTrigger" type="button">＋ 添加表格</button></div><input id="filesInput" type="file" accept=".xlsx,.csv,.tsv,.txt" multiple hidden>
        <small class="import-hint" id="importHint">支持 Excel、CSV，可一次选择多张</small>
        <details class="source-disclosure" id="sourceDisclosure" hidden><summary>已添加的表格<small id="sourceCount">0 张</small></summary><div id="sourceList" class="stack" aria-label="数据表列表"></div></details>
        <details class="manual-entry"><summary>手动输入或粘贴</summary><div class="stack manual-source">
          <label class="control">表格名称<input class="field" id="manualName" placeholder="例如：已报名名单"></label>
          <label class="control">输入方式<select class="field" id="manualFormat"><option value="names">名单：每行一个姓名或编号（无表头）</option><option value="table">表格：从 Excel 粘贴，或输入 CSV</option></select></label>
          <label class="control">数据内容<textarea class="field" id="manualText" rows="7" placeholder="张小雨&#10;王一鸣&#10;李可心"></textarea></label>
          <small id="manualHint">每行一人，也可以作为参与表。</small>
          <label id="manualHeaderWrap" hidden><input type="checkbox" id="manualHeader" checked>第一行是表头</label>
          <button class="btn" id="addManual" type="button">添加到数据表</button>
        </div></details>
      </section>

      <section class="section stack" id="modeControls">
        <div class="step-head"><span class="step-index">2</span><strong id="ruleTitle">设置规则</strong></div>
        <label class="control" id="sourceALabel" hidden>以哪张表为准？<select class="field" id="sourceA" aria-describedby="sourceHint"></select></label>
        <small id="sourceHint" hidden></small>
        <p class="setup-empty" id="setupEmpty">再添加一张表，就可以设置匹配规则。</p>
        <div class="stack merge-builder" data-controls="match compare" hidden>
          <div class="builder-heading"><strong>按哪一列匹配？</strong></div>
          <div id="baseKeyList" class="stack"></div>
          <button class="quiet-action" id="addKey" type="button">＋ 再加一个匹配条件</button>
          <details class="field-disclosure" id="baseFieldWrap"><summary id="baseFieldSummary">基准表保留字段</summary><div id="baseFieldList" class="field-picker"></div></details>
          <div class="builder-heading"><strong id="joinHeading">从哪些表补充？</strong></div>
          <div id="joinList" class="stack join-list"></div>
          <button class="btn builder-add" id="addJoin" type="button">＋ 添加参与表</button>
          <details class="advanced-options"><summary>匹配选项</summary><div class="check-list"><label><input type="checkbox" id="fuzzyMatch" checked>忽略空格、大小写和全角字符差异</label></div><div class="check-list" id="compareChangesWrap" hidden><label><input type="checkbox" id="compareChanges" checked>检查同名字段的内容变化</label></div></details>
        </div>
        <div class="stack" data-controls="clean" hidden>
          <label class="control">重复判断列<select class="field" id="dedupeKey"><option value="*">整行完全相同</option></select></label>
          <div class="check-list">
            <label><input type="checkbox" id="cleanSpaces" checked>清除首尾空格和多余空白</label>
            <label><input type="checkbox" id="cleanBlankRows" checked>删除完全空白的行</label>
            <label><input type="checkbox" id="cleanBlankCols" checked>删除完全空白的列</label>
            <label><input type="checkbox" id="cleanDuplicates" checked>删除重复记录，保留第一条</label>
            <label><input type="checkbox" id="cleanPunctuation">统一中文标点和全角数字</label>
          </div>
        </div>
        <div class="stack" data-controls="grade" hidden>
          <label class="control">学生姓名列<select class="field" id="studentColumn"></select></label>
          <label class="control">成绩列<select class="field" id="scoreColumn"><option value="*">自动识别全部成绩列</option></select></label>
          <div class="row"><label class="control">及格线<input class="field" id="passLine" type="number" min="0" max="1000" value="60"></label><label class="control">优秀线<input class="field" id="excellentLine" type="number" min="0" max="1000" value="90"></label></div>
        </div>
      </section>
    </div>
    <div class="task-footer" id="taskFooter"><button class="btn primary run-button" id="runTask" type="button" aria-describedby="runHint" disabled>开始合并</button><small id="runHint" aria-live="polite">先添加至少两张表</small><button class="quiet-action" id="loadSample" type="button">没有表格？试用示例</button></div>
  </section>

  <section class="panel center" data-workspace-panel="center" data-mobile-panel-name="preview">
    <div class="panel-head"><h2 id="previewTitle">表格预览</h2><div class="tabs center-tabs" id="centerTabs" role="group" aria-label="结果展示方式" hidden><button class="tab center-tab active" id="tableTab" type="button" aria-pressed="true">表格</button><button class="tab center-tab" id="chartTab" type="button" aria-pressed="false" hidden>图表</button></div></div>
    <div class="preview-toolbar" id="previewToolbar" hidden><label for="previewSource">查看原表</label><select class="field" id="previewSource"></select><button class="btn small" id="viewResult" type="button" hidden>返回结果</button></div>
    <div class="result-actions" id="resultActions" hidden><div class="result-action-label"><strong>结果已就绪</strong><details id="resultDetails" hidden><summary>处理详情</summary><p id="resultSummary"></p></details></div><div class="result-action-buttons"><button class="btn" id="saveResult" type="button" title="添加到左侧数据列表，继续处理" disabled>继续用此表</button><button class="btn primary" id="exportResult" type="button" disabled>导出表格</button></div></div>
    <div class="table-stage" id="tableStage" tabindex="0" aria-label="表格预览，可横向滚动"><div class="table-empty" id="tableEmpty"><div><span aria-hidden="true"></span><strong id="emptyTitle">把几张表，整理成一张</strong><small id="emptyDescription">添加至少两张表，自动识别匹配列</small><button class="btn primary empty-upload" id="emptyUpload" type="button">添加表格</button><p class="local-note">数据仅在本机处理</p></div></div><table class="data-table" id="dataTable" hidden><thead></thead><tbody></tbody></table></div>
    <div class="chart-stage" id="chartStage" hidden><div class="chart-card" id="distributionChart" role="img" aria-label="成绩分布图"></div><div class="chart-card" id="summaryChart" role="img" aria-label="学科统计图"></div><div class="chart-card wide" id="rankingChart" role="img" aria-label="学生成绩排名图"></div></div>
    <div class="center-status" id="centerStatus" role="status">等待添加表格</div>
  </section>

  <div class="panel-resizer left" id="leftResizer" role="separator" aria-label="调整任务设置栏宽度" aria-orientation="vertical" tabindex="0"></div>
</main>
<button class="side-reveal left" id="showLeft" aria-hidden="true">任务设置</button>
</div>
<nav class="mobile-nav" aria-label="手机端功能导航"><button class="active" type="button" data-mobile-panel="setup" aria-current="page">任务</button><button type="button" data-mobile-panel="preview">预览</button></nav>
<div id="toast" hidden></div>
<script src="../../../node_modules/echarts/dist/echarts.min.js"></script>
<script src="../../../node_modules/exceljs/dist/exceljs.min.js"></script>
<script src="../scripts/mimi-common.js"></script><script src="../scripts/mimi-workspace.js"></script><script src="../scripts/mimi-table-merge.js"></script><script src="../scripts/mimi-table-workbook.js"></script><script src="../scripts/mimi-table.js?v=7"></script>
</body></html>
