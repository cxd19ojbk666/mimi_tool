<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><title>咪咪大王点名器</title><link rel="icon" href="../../../assets/mimi-toolbox-transparent.ico">
<style>
:root{--ink:#263d4a;--paper:#fff8df;--card:#fffdf5;--red:#ff715b;--yellow:#ffd15a;--mint:#91d9c9;--blue:#75c6eb;--muted:#72838b;--line:#b3c0c4;--shadow:rgba(38,61,74,.15)}*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--ink);background-color:var(--paper);background-image:linear-gradient(rgba(117,198,235,.12) 1px,transparent 1px),linear-gradient(90deg,rgba(117,198,235,.08) 1px,transparent 1px);background-size:28px 28px;font-family:"YouYuan","Yuanti SC","PingFang SC","Microsoft YaHei",sans-serif}button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}.shell{width:min(1440px,100%);margin:auto;padding:24px 28px 34px}header{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:20px}.brand{display:flex;align-items:center;gap:14px}.back{display:grid;place-items:center;width:44px;height:44px;border:2px solid var(--ink);border-radius:14px 11px 15px 12px;background:var(--card);box-shadow:3px 4px 0 var(--shadow);text-decoration:none;font-size:24px;font-weight:900}.brand h1{margin:0;font-size:clamp(27px,4vw,40px);letter-spacing:.06em;text-shadow:2px 2px #fff,3px 3px #bde5f5}.brand p{margin:5px 0 0;color:var(--muted);font-size:13px;font-weight:800}.badge{padding:8px 13px;border:2px solid var(--ink);border-radius:99px;background:#dff5e8;font-size:13px;font-weight:900;white-space:nowrap}.layout{display:grid;grid-template-columns:310px minmax(360px,1fr) 310px;gap:18px;align-items:stretch}.panel{min-width:0;border:2.5px solid var(--ink);border-radius:22px 17px 24px 19px;background:rgba(255,253,245,.97);box-shadow:5px 7px 0 var(--shadow);overflow:hidden}.panel-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 18px 13px;border-bottom:2px dashed #cad4d6}.panel-head h2{margin:0;font-size:18px}.panel-body{padding:16px 18px}.upload{display:block;padding:16px;border:2px dashed #8ca3ad;border-radius:16px;background:#f7fbf8;text-align:center;font-weight:900;transition:.18s}.upload:hover,.upload:focus-within{background:#e6f7ef;border-color:#4e9184}.upload input{position:absolute;width:1px;height:1px;opacity:0}.upload small{display:block;margin-top:4px;color:var(--muted);font-size:11px}.or{display:flex;align-items:center;gap:8px;margin:12px 0;color:#98a5aa;font-size:11px}.or:before,.or:after{content:"";height:1px;flex:1;background:#d7dfe0}textarea{width:100%;min-height:105px;padding:11px;border:2px solid #b4c2c7;border-radius:13px;background:#fff;resize:vertical;outline:none;line-height:1.6}textarea:focus,input:focus,select:focus{border-color:var(--blue);box-shadow:0 0 0 4px rgba(117,198,235,.2)}.btn{min-height:42px;padding:9px 14px;border:2px solid var(--ink);border-radius:13px 10px 14px 11px;background:#fff;color:var(--ink);font-weight:900;box-shadow:2px 3px 0 var(--shadow);transition:.15s}.btn:hover{transform:translateY(-2px);box-shadow:3px 5px 0 var(--shadow)}.btn:active{transform:translate(1px,1px);box-shadow:1px 1px 0 var(--shadow)}.btn.primary{background:var(--red);color:#fff}.btn.yellow{background:var(--yellow)}.btn.mint{background:var(--mint)}.wide{width:100%}.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}.tip{margin:8px 0 0;color:var(--muted);font-size:11px;line-height:1.6}.stats{display:flex;gap:7px;flex-wrap:wrap}.stat{padding:5px 9px;border-radius:99px;background:#e5f5fa;font-size:11px;font-weight:900}.student-list{display:grid;gap:7px;max-height:375px;margin-top:13px;overflow:auto}.student{display:grid;grid-template-columns:minmax(0,1fr) 52px 64px 25px;gap:6px;align-items:center;padding:7px 8px;border:1.5px solid #d7dfe0;border-radius:11px;background:#fff}.student.done{opacity:.5;background:#f0f1ed}.student input,.student select{width:100%;min-width:0;padding:5px;border:1px solid #ccd5d8;border-radius:7px;background:#fff;font-size:12px}.student .del{padding:0;border:0;background:none;color:#a5635a;font-size:17px}.empty{padding:30px 12px;text-align:center;color:var(--muted);font-size:13px;line-height:1.7}.stage{display:flex;flex-direction:column;min-height:650px}.filters{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:16px 18px}.control label{display:block;margin:0 0 5px;font-size:12px;font-weight:900}.control select{width:100%;padding:9px 10px;border:2px solid #b7c4c8;border-radius:11px;background:#fff;outline:none}.switch{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border-radius:12px;background:#f2f6ef;font-size:13px;font-weight:900}.switch input{width:38px;height:21px;accent-color:#3b8d7f}.display{position:relative;flex:1;display:grid;place-items:center;min-height:390px;padding:22px;overflow:hidden;background:radial-gradient(circle at center,#fffef8 0 32%,transparent 33%),linear-gradient(135deg,rgba(255,209,90,.16),rgba(117,198,235,.14))}.display:before,.display:after{content:"";position:absolute;width:70px;height:70px;border:14px solid var(--yellow);opacity:.32;transform:rotate(18deg)}.display:before{left:-28px;top:40px}.display:after{right:-30px;bottom:30px;border-color:var(--mint);border-radius:50%}.result{text-align:center;z-index:1}.result small{display:block;margin-bottom:12px;color:var(--muted);font-weight:900}.name{min-height:100px;display:grid;place-items:center;font-size:clamp(46px,7vw,92px);font-weight:900;letter-spacing:.06em;color:#2e5368;text-shadow:4px 4px 0 #cceaf6;word-break:break-all}.meta{margin-top:10px;color:#607985;font-size:14px;font-weight:900}.draw-wrap{padding:18px;border-top:2px dashed #cad4d6}.draw{width:100%;min-height:58px;font-size:19px}.history-list{display:grid;gap:8px;max-height:360px;overflow:auto}.history-item{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:11px;background:#f5f4ea}.history-num{display:grid;place-items:center;flex:none;width:25px;height:25px;border-radius:50%;background:var(--yellow);font:900 11px/1 sans-serif}.history-item b{flex:1}.history-item small{color:var(--muted)}.history-actions{margin-top:12px}.wheel-box{display:grid;place-items:center;padding:18px}.wheel-wrap{position:relative;width:min(250px,100%);aspect-ratio:1}.pointer{position:absolute;z-index:3;top:-10px;left:50%;width:0;height:0;border-left:13px solid transparent;border-right:13px solid transparent;border-top:29px solid var(--red);filter:drop-shadow(1px 2px 0 var(--ink));transform:translateX(-50%)}canvas{width:100%;height:100%;filter:drop-shadow(4px 5px 0 rgba(38,61,74,.16));transition:transform 3.2s cubic-bezier(.16,.74,.18,1)}.wheel-title{margin:0;padding:12px 18px 0;font-size:15px;text-align:center}.wheel-empty{padding:65px 15px;text-align:center;color:var(--muted)}#toast{position:fixed;z-index:20;left:50%;bottom:24px;transform:translateX(-50%);padding:11px 18px;border:2px solid var(--ink);border-radius:13px;background:#3f6172;color:white;font-size:13px;font-weight:900;box-shadow:4px 5px 0 var(--shadow)}@media(max-width:1050px){.layout{grid-template-columns:280px 1fr}.history-panel{grid-column:1/-1}.history-panel .panel-body{display:grid;grid-template-columns:1fr 280px;gap:20px}.stage{min-height:600px}}@media(max-width:720px){.shell{padding:14px 12px 26px}header{align-items:flex-start}.badge{display:none}.layout{display:block}.panel{margin-bottom:16px}.stage{min-height:570px}.history-panel .panel-body{display:block}.student-list{max-height:280px}.name{font-size:52px}.filters{padding:14px}.display{min-height:320px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style></head><body><div class="shell">
<header><div class="brand"><a class="back" href="../index.html" aria-label="返回工具箱">‹</a><div><h1>咪咪大王点名器</h1><p>每一次点名，都留一点悬念</p></div></div><div class="badge" id="topBadge">等待导入名单</div></header>
<main class="layout"><aside class="panel"><div class="panel-head"><h2>① 学生名单</h2><button class="btn" id="clearBtn">清空</button></div><div class="panel-body"><label class="upload">＋ 上传名单<input id="fileInput" type="file" accept=".csv,.txt,text/csv,text/plain"><small>支持 CSV / TXT，识别姓名、性别、小组</small></label><div class="or">或者直接粘贴</div><textarea id="paste" placeholder="示例：&#10;姓名,性别,小组&#10;张小雨,女,第一组&#10;王一鸣,男,第二组"></textarea><button class="btn mint wide" id="importBtn">导入这些同学</button><p class="tip">纯姓名可一行一个；也支持逗号、制表符分列。</p><div class="stats" id="stats"></div><div class="student-list" id="studentList"></div><button class="btn wide" id="addBtn" style="margin-top:10px">＋ 添加一位同学</button></div></aside>
<section class="panel stage"><div class="filters"><div class="control"><label for="genderFilter">性别分组</label><select id="genderFilter"><option value="all">全班同学</option><option value="男">只抽男生</option><option value="女">只抽女生</option></select></div><div class="control"><label for="groupFilter">小组抽取</label><select id="groupFilter"><option value="all">全部小组</option></select></div><label class="switch">已点过暂不重复 <input id="noRepeat" type="checkbox" checked></label></div><div class="display"><div class="result"><small id="eyebrow">准备好了吗？</small><div class="name" id="resultName">点击开始</div><div class="meta" id="resultMeta">名单导入后即可随机点名</div></div></div><div class="draw-wrap"><button class="btn primary draw" id="drawBtn">✦ 开始点名</button></div></section>
<aside class="panel history-panel"><div class="panel-head"><h2>② 幸运记录</h2><span class="stat" id="historyCount">0 次</span></div><div class="panel-body"><div><div class="history-list" id="historyList"><div class="empty">还没有抽取记录<br>第一位幸运同学会是谁？</div></div><div class="row history-actions"><button class="btn" id="undoBtn">撤回</button><button class="btn" id="resetBtn">全部归队</button></div></div><div><h3 class="wheel-title">幸运转盘</h3><div class="wheel-box" id="wheelBox"><div class="wheel-wrap"><div class="pointer"></div><canvas id="wheel" width="500" height="500"></canvas></div></div><button class="btn yellow wide" id="spinBtn">转动转盘</button></div></div></aside></main></div><div id="toast" hidden role="status"></div>
<script>
'use strict';const $=id=>document.getElementById(id);const COLORS=['#ffd15a','#91d9c9','#75c6eb','#ff9c89','#c9b5ed','#b8df78'];let state={students:[],history:[]},spinning=false,rotation=0,timer;try{const saved=localStorage.getItem('mimi-roll-call');if(saved)state=JSON.parse(saved)}catch(e){};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const save=()=>localStorage.setItem('mimi-roll-call',JSON.stringify(state));function toast(t){$('toast').textContent=t;$('toast').hidden=false;clearTimeout(timer);timer=setTimeout(()=>$('toast').hidden=true,2600)}
function parse(text){const lines=text.trim().split(/\r?\n/).filter(x=>x.trim());if(!lines.length)return[];const delim=lines.some(x=>x.includes('\t'))?'\t':lines.some(x=>x.includes(','))?',':lines.some(x=>x.includes('，'))?'，':null;let rows=lines.map(x=>delim?x.split(delim).map(v=>v.trim()):[x.trim()]);const header=rows[0].map(x=>x.toLowerCase()),hasHeader=header.some(x=>/姓名|名字|name|性别|gender|小组|组别|group/.test(x));let ni=0,gi=1,ti=2;if(hasHeader){ni=header.findIndex(x=>/姓名|名字|name/.test(x));gi=header.findIndex(x=>/性别|gender/.test(x));ti=header.findIndex(x=>/小组|组别|group/.test(x));rows.shift()}return rows.filter(r=>r[ni]?.trim()).map(r=>({id:Date.now()+Math.random(),name:r[ni].trim(),gender:gi>=0?(r[gi]||'未分'):'未分',group:ti>=0?(r[ti]||'未分组'):'未分组',done:false}))}
function eligible(){return state.students.filter(s=>($('genderFilter').value==='all'||s.gender===$('genderFilter').value)&&($('groupFilter').value==='all'||s.group===$('groupFilter').value)&&(!$('noRepeat').checked||!s.done))}
function render(){const total=state.students.length,done=state.students.filter(s=>s.done).length;$('stats').innerHTML=`<span class="stat">共 ${total} 人</span><span class="stat">已点 ${done} 人</span><span class="stat">待点 ${total-done} 人</span>`;$('topBadge').textContent=total?`今天有 ${total} 位同学`:'等待导入名单';$('studentList').innerHTML=total?state.students.map(s=>`<div class="student ${s.done?'done':''}" data-id="${s.id}"><input data-k="name" value="${esc(s.name)}" aria-label="姓名"><select data-k="gender" aria-label="性别"><option ${s.gender==='男'?'selected':''}>男</option><option ${s.gender==='女'?'selected':''}>女</option><option ${s.gender==='未分'?'selected':''}>未分</option></select><input data-k="group" value="${esc(s.group)}" aria-label="小组"><button class="del" aria-label="删除">×</button></div>`).join(''):'<div class="empty">名单还是空的<br>上传文件或粘贴名单开始吧</div>';const groups=[...new Set(state.students.map(s=>s.group).filter(Boolean))];const gv=$('groupFilter').value;$('groupFilter').innerHTML='<option value="all">全部小组</option>'+groups.map(g=>`<option value="${esc(g)}">${esc(g)}</option>`).join('');if(groups.includes(gv))$('groupFilter').value=gv;$('historyCount').textContent=`${state.history.length} 次`;$('historyList').innerHTML=state.history.length?state.history.map((h,i)=>`<div class="history-item"><span class="history-num">${state.history.length-i}</span><b>${esc(h.name)}</b><small>${esc(h.gender)} · ${esc(h.group)}</small></div>`).join(''):'<div class="empty">还没有抽取记录<br>第一位幸运同学会是谁？</div>';$('undoBtn').disabled=!state.history.length;drawWheel();save()}
function drawWheel(){const c=$('wheel'),ctx=c.getContext('2d'),list=eligible(),n=Math.min(list.length,18);ctx.clearRect(0,0,500,500);if(!n){ctx.fillStyle='#eaf0ed';ctx.beginPath();ctx.arc(250,250,220,0,Math.PI*2);ctx.fill();ctx.fillStyle='#72838b';ctx.font='bold 28px sans-serif';ctx.textAlign='center';ctx.fillText('暂无可抽取同学',250,258);return}for(let i=0;i<n;i++){const a=i*Math.PI*2/n-Math.PI/2,b=(i+1)*Math.PI*2/n-Math.PI/2;ctx.beginPath();ctx.moveTo(250,250);ctx.arc(250,250,220,a,b);ctx.closePath();ctx.fillStyle=COLORS[i%COLORS.length];ctx.fill();ctx.strokeStyle='#263d4a';ctx.lineWidth=3;ctx.stroke();ctx.save();ctx.translate(250,250);ctx.rotate((a+b)/2);ctx.textAlign='right';ctx.fillStyle='#263d4a';ctx.font=`900 ${n>12?17:22}px sans-serif`;let name=list[i].name;ctx.fillText(name.length>6?name.slice(0,5)+'…':name,205,7);ctx.restore()}ctx.beginPath();ctx.arc(250,250,34,0,Math.PI*2);ctx.fillStyle='#fffdf5';ctx.fill();ctx.stroke();ctx.fillStyle='#263d4a';ctx.font='900 18px sans-serif';ctx.textAlign='center';ctx.fillText('咪',250,257)}
function choose(spin=false){if(spinning)return;const list=eligible();if(!list.length){toast(state.students.length?'当前范围都已点过，点击“全部归队”再来一轮吧':'请先导入学生名单');return}spinning=true;const pick=list[Math.floor(Math.random()*list.length)],names=list.map(s=>s.name);let i=0;$('eyebrow').textContent='名字正在跳舞…';const flick=setInterval(()=>{$('resultName').textContent=names[i++%names.length]},70);if(spin){rotation+=1440+Math.random()*720;$('wheel').style.transform=`rotate(${rotation}deg)`}setTimeout(()=>{clearInterval(flick);pick.done=true;state.history.unshift({...pick,time:Date.now()});$('resultName').textContent=pick.name;$('resultMeta').textContent=`${pick.gender} · ${pick.group}`;$('eyebrow').textContent='本次抽中';spinning=false;render()},spin?3200:900)}
$('importBtn').onclick=()=>{const items=parse($('paste').value);if(!items.length)return toast('没有读到姓名，请检查名单格式');state.students.push(...items);$('paste').value='';render();toast(`成功导入 ${items.length} 位同学`)};$('fileInput').onchange=async e=>{const f=e.target.files[0];if(!f)return;const text=await f.text();const items=parse(text);if(!items.length)return toast('没有识别到姓名');state.students.push(...items);render();toast(`已从文件导入 ${items.length} 位同学`);e.target.value=''};$('addBtn').onclick=()=>{state.students.push({id:Date.now()+Math.random(),name:'新同学',gender:'未分',group:'未分组',done:false});render();$('studentList').scrollTop=99999};$('studentList').onchange=e=>{const row=e.target.closest('.student');if(!row)return;const s=state.students.find(x=>String(x.id)===row.dataset.id);if(s&&e.target.dataset.k)s[e.target.dataset.k]=e.target.value.trim()||'未分';render()};$('studentList').onclick=e=>{if(!e.target.classList.contains('del'))return;const id=e.target.closest('.student').dataset.id;state.students=state.students.filter(s=>String(s.id)!==id);render()};$('drawBtn').onclick=()=>choose(false);$('spinBtn').onclick=()=>choose(true);$('genderFilter').onchange=drawWheel;$('groupFilter').onchange=drawWheel;$('noRepeat').onchange=drawWheel;$('resetBtn').onclick=()=>{state.students.forEach(s=>s.done=false);render();toast('所有同学已重新归队')};$('undoBtn').onclick=()=>{const h=state.history.shift();if(h){const s=state.students.find(x=>x.id===h.id);if(s)s.done=false;$('resultName').textContent='已撤回';$('resultMeta').textContent=`${h.name} 已回到待抽名单`;render()}};$('clearBtn').onclick=()=>{if(!state.students.length||confirm('确定清空全部学生与抽取记录吗？')){state={students:[],history:[]};$('resultName').textContent='点击开始';$('resultMeta').textContent='名单导入后即可随机点名';render()}};document.addEventListener('keydown',e=>{if(e.code==='Space'&&!['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)){e.preventDefault();choose(false)}});render();
</script></body></html>
