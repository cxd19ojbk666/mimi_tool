<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light">
<title>咪咪大王点名器</title>
<link rel="icon" href="../../../assets/mimi-toolbox-transparent.ico">
<link rel="stylesheet" href="../styles/mimi-ui.css?v=4">
<style>
/* 点名页：左侧准备与筛选，中间专心抽取，右侧回看记录。 */
body[data-mimi-tool="roll-call"]{--left-w:290px;--right-w:286px}
body[data-mimi-tool="roll-call"],body[data-mimi-tool="roll-call"] *{scrollbar-width:none;scrollbar-gutter:auto}
body[data-mimi-tool="roll-call"]::-webkit-scrollbar,body[data-mimi-tool="roll-call"] *::-webkit-scrollbar{display:none;width:0;height:0}
body[data-mimi-tool="roll-call"] .brand h1{font-weight:900}
body[data-mimi-tool="roll-call"] .brand p{margin:7px 0 0;font-size:13px;font-weight:800;letter-spacing:.03em}
body[data-mimi-tool="roll-call"] .center .panel-head{background:#dff3fb}
body[data-mimi-tool="roll-call"] .center .panel-head h2:before{background:var(--blue)}
body[data-mimi-tool="roll-call"] .filters{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:13px;border:2px dashed #9fb4bd;border-radius:15px;background:#f3faf7}
body[data-mimi-tool="roll-call"] .filters [hidden]{display:none!important}
body[data-mimi-tool="roll-call"] .filters .control{min-width:0}
body[data-mimi-tool="roll-call"] .filters .control:nth-child(3),body[data-mimi-tool="roll-call"] .filters .switchline{grid-column:1/-1}
body[data-mimi-tool="roll-call"] .filters .switchline{min-height:38px;padding:0 2px;white-space:nowrap}
body[data-mimi-tool="roll-call"] .stage{isolation:isolate;min-height:300px;background-color:#fffdf6;background-image:radial-gradient(circle at 18% 20%,rgba(255,201,79,.2) 0 4px,transparent 5px),radial-gradient(circle at 84% 28%,rgba(104,189,232,.2) 0 5px,transparent 6px),radial-gradient(circle at 75% 82%,rgba(50,168,137,.14) 0 4px,transparent 5px);background-size:88px 88px,116px 116px,104px 104px}
body[data-mimi-tool="roll-call"] .stage:before{content:"";position:absolute;z-index:-1;width:min(52vw,430px);aspect-ratio:1;border:3px dashed rgba(104,189,232,.45);border-radius:50%;background:radial-gradient(circle,#fff8d9 0 42%,#ffefaa 43% 58%,rgba(255,201,79,.18) 59% 68%,transparent 69%);transform:rotate(-4deg)}
body[data-mimi-tool="roll-call"] .stage:after{content:"·  随 机 点 名  ·";position:absolute;top:38px;left:50%;color:#65808f;font-size:12px;font-weight:900;letter-spacing:.18em;transform:translateX(-50%);white-space:nowrap}
body[data-mimi-tool="roll-call"] .result{position:relative;z-index:1;width:min(78%,680px);margin:auto;padding:70px 18px 44px}
body[data-mimi-tool="roll-call"] .result #resultName{position:relative;color:#2e5368;text-shadow:3px 4px 0 #cceaf6;letter-spacing:.1em;transform-origin:center;will-change:transform,filter,opacity}
body[data-mimi-tool="roll-call"] .result #resultMeta{color:#607987;font-size:14px;font-weight:800}
body[data-mimi-tool="roll-call"] .draw-progress{position:absolute;z-index:2;left:50%;bottom:30px;width:min(180px,42%);height:6px;overflow:hidden;border:1.5px solid rgba(48,67,84,.28);border-radius:999px;background:rgba(255,255,255,.65);opacity:0;transform:translateX(-50%);transition:opacity .18s ease}
body[data-mimi-tool="roll-call"] .draw-progress:before{content:"";display:block;width:100%;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--blue),var(--gold),#ff785d);transform:translateX(-105%)}
body[data-mimi-tool="roll-call"] .drawing .draw-progress{opacity:1}
body[data-mimi-tool="roll-call"] .drawing .draw-progress:before{animation:draw-progress 1.45s cubic-bezier(.18,.76,.2,1) forwards}
body[data-mimi-tool="roll-call"] .drawing #resultName{animation:name-shuffle .14s ease-in-out infinite alternate;color:#39778f;filter:blur(.35px);text-shadow:2px 3px 0 rgba(104,189,232,.22)}
body[data-mimi-tool="roll-call"] .drawing .stage:before{animation:ring-spin 1.45s cubic-bezier(.22,.65,.24,1) both;border-style:solid dashed}
body[data-mimi-tool="roll-call"] .reveal #resultName{animation:name-reveal .72s cubic-bezier(.16,1.3,.3,1) both}
body[data-mimi-tool="roll-call"] .reveal .stage:before{animation:ring-reveal .72s ease-out both}
body[data-mimi-tool="roll-call"] .spark{position:absolute;z-index:3;left:50%;top:50%;width:9px;height:18px;border:1px solid rgba(48,67,84,.22);border-radius:3px;background:var(--spark-color,var(--gold));opacity:0;pointer-events:none;transform:translate(-50%,-50%) rotate(var(--spark-rotate,0deg))}
body[data-mimi-tool="roll-call"] .spark:nth-of-type(1){--spark-x:-150px;--spark-y:-98px;--spark-rotate:-28deg;--spark-color:#ff785d}
body[data-mimi-tool="roll-call"] .spark:nth-of-type(2){--spark-x:-190px;--spark-y:8px;--spark-rotate:62deg;--spark-color:#68bde8}
body[data-mimi-tool="roll-call"] .spark:nth-of-type(3){--spark-x:-118px;--spark-y:105px;--spark-rotate:18deg;--spark-color:#32a889}
body[data-mimi-tool="roll-call"] .spark:nth-of-type(4){--spark-x:146px;--spark-y:-102px;--spark-rotate:34deg;--spark-color:#ffc94f}
body[data-mimi-tool="roll-call"] .spark:nth-of-type(5){--spark-x:190px;--spark-y:4px;--spark-rotate:-54deg;--spark-color:#32a889}
body[data-mimi-tool="roll-call"] .spark:nth-of-type(6){--spark-x:112px;--spark-y:108px;--spark-rotate:-18deg;--spark-color:#ff785d}
body[data-mimi-tool="roll-call"] .reveal .spark{animation:spark-pop .78s cubic-bezier(.15,.72,.2,1) both}
body[data-mimi-tool="roll-call"] .reveal .spark:nth-of-type(even){animation-delay:.04s}
@keyframes name-shuffle{from{transform:translateY(-4px) scale(.985);opacity:.58}to{transform:translateY(4px) scale(1.02);opacity:.92}}
@keyframes name-reveal{0%{transform:scale(.72) rotate(-2deg);filter:blur(5px);opacity:.2}52%{transform:scale(1.14) rotate(1deg);filter:blur(0);opacity:1}76%{transform:scale(.97) rotate(-.4deg)}100%{transform:scale(1) rotate(0);filter:blur(0);opacity:1}}
@keyframes ring-spin{0%{transform:rotate(-4deg) scale(.92);opacity:.62}75%{transform:rotate(188deg) scale(1.03);opacity:1}100%{transform:rotate(212deg) scale(.96);opacity:.72}}
@keyframes ring-reveal{0%{transform:rotate(-4deg) scale(.88);filter:brightness(1)}45%{transform:rotate(2deg) scale(1.08);filter:brightness(1.08)}100%{transform:rotate(-4deg) scale(1);filter:brightness(1)}}
@keyframes draw-progress{0%{transform:translateX(-105%)}70%{transform:translateX(-20%)}100%{transform:translateX(0)}}
@keyframes spark-pop{0%{opacity:0;transform:translate(-50%,-50%) scale(.2) rotate(var(--spark-rotate))}24%{opacity:1}100%{opacity:0;transform:translate(calc(-50% + var(--spark-x)),calc(-50% + var(--spark-y))) scale(.82) rotate(calc(var(--spark-rotate) + 90deg))}}
body[data-mimi-tool="roll-call"] .draw-actions{position:relative;z-index:2;padding:0 clamp(42px,11vw,138px) 20px}
body[data-mimi-tool="roll-call"] .draw-actions .draw{position:relative;border-radius:18px 14px 20px 15px;box-shadow:5px 6px 0 rgba(48,67,84,.24);letter-spacing:.1em}
body[data-mimi-tool="roll-call"] .draw-actions .draw:after{content:"空格键";position:absolute;right:14px;top:50%;padding:3px 7px;border:1.5px solid currentColor;border-radius:6px;font-size:10px;letter-spacing:0;opacity:.8;transform:translateY(-50%)}
body[data-mimi-tool="roll-call"] .status{text-align:center;font-weight:800}
body[data-mimi-tool="roll-call"] .right-panel .panel-body{background:linear-gradient(180deg,#fffdf3,#fffaf0)}
body[data-mimi-tool="roll-call"] .left-panel{min-width:auto;min-height:0}
body[data-mimi-tool="roll-call"] .left-panel .panel-head{gap:normal}
body[data-mimi-tool="roll-call"] .left-panel .panel-head h2{color:#344e60;font-family:"YouYuan","Yuanti SC","STKaiti",sans-serif;letter-spacing:.06em}
body[data-mimi-tool="roll-call"] .left-panel .panel-head .btn.small{min-height:34px;border-width:1.5px}
body[data-mimi-tool="roll-call"] .roster-tabs{display:grid;grid-template-columns:repeat(2,1fr);gap:4px;position:sticky;top:0;z-index:10;width:100%;max-width:100%;min-height:48px;margin:0 0 22px;padding:5px;overflow:hidden;border:2px solid #9cb4c1;border-radius:15px;background:#dfeef3;box-shadow:0 5px 0 #fffdf3;isolation:isolate}
body[data-mimi-tool="roll-call"] .roster-tab{min-width:0;min-height:39px;border:0;border-radius:10px;background:transparent;color:#6d7b84;font-weight:800}
body[data-mimi-tool="roll-call"] .roster-tab.active{background:var(--gold);color:var(--ink);box-shadow:2px 3px 0 rgba(48,67,84,.15);font-weight:700;transform:rotate(-1deg)}
body[data-mimi-tool="roll-call"] .roster-tab:before{content:"";display:inline-block;width:7px;height:7px;margin-right:6px;border:1px solid var(--ink);border-radius:50%;background:var(--blue);vertical-align:1px}
body[data-mimi-tool="roll-call"] .roster-tab[data-roster-tab="filter"]:before{background:#ff785d}
body[data-mimi-tool="roll-call"] .roster-tabpage{display:none}
body[data-mimi-tool="roll-call"] .roster-tabpage.active{display:block}
body[data-mimi-tool="roll-call"] .roster-tabpage>.section:first-child{margin-top:0;padding-top:0;border-top:0}
body[data-mimi-tool="roll-call"] .roster-label{justify-content:space-between;align-items:center;gap:10px;color:#344f60;font-weight:700}
body[data-mimi-tool="roll-call"] .roster-title{display:flex;align-items:center;gap:.25em}
body[data-mimi-tool="roll-call"] .roster-template-btn{flex:none;border:0;background:transparent;color:#39768f;padding:2px 0;font-family:inherit;font-size:12px;font-weight:800;line-height:1.4;text-decoration:underline;text-underline-offset:3px}
body[data-mimi-tool="roll-call"] .roster-template-btn:hover{color:#24556b}
body[data-mimi-tool="roll-call"] .roster-template-btn:focus-visible{outline:3px solid var(--blue);outline-offset:3px;border-radius:4px}
body[data-mimi-tool="roll-call"] .filelabel{min-height:42px;padding:9px 12px;display:grid;place-items:center;border:2px dashed var(--blue);border-radius:13px;background:#eefaff;color:var(--green);cursor:pointer;font-size:13px;font-weight:800;text-align:center}
body[data-mimi-tool="roll-call"] .filelabel:hover{background:#dff5ff}
body[data-mimi-tool="roll-call"] .filelabel.is-disabled{pointer-events:none;opacity:.45}
body[data-mimi-tool="roll-call"] #importStatus:empty{display:none}
body[data-mimi-tool="roll-call"] .left-panel .panel-body{display:flex;flex:1 1 0%;min-height:0;flex-direction:column}
body[data-mimi-tool="roll-call"] .roster-tabs{flex:0 0 auto}
body[data-mimi-tool="roll-call"] #roster-tab-import.active{display:flex;flex:1 1 auto;min-height:0;flex-direction:column}
body[data-mimi-tool="roll-call"] #roster-tab-import .label{flex:0 0 auto}
body[data-mimi-tool="roll-call"] #rosterText{flex:1 1 auto;min-width:auto;min-height:220px;line-height:27px;background-size:100% 27px;box-shadow:inset 0 -2px 0 rgba(105,133,147,.08);resize:vertical}
body[data-mimi-tool="roll-call"] #roster-tab-import>.hint{flex:0 0 auto;margin-top:12px;margin-bottom:14px}
body[data-mimi-tool="roll-call"] #roster-tab-import>.row{flex:0 0 auto;margin-top:16px}
body[data-mimi-tool="roll-call"] #roster-tab-import>.row>*{min-width:auto}
body[data-mimi-tool="roll-call"] #roster-tab-import #applyRoster{min-height:40px}
body[data-mimi-tool="roll-call"] #sheetControl{flex:0 0 auto;margin-top:17px}
body[data-mimi-tool="roll-call"] #importStatus{color:#78838c}
body[data-mimi-tool="roll-call"] .left-panel details.section>summary{padding:10px 12px;border:2px dashed #9fb4bd;border-radius:12px;background:#fff8d7;cursor:pointer;list-style:none}
body[data-mimi-tool="roll-call"] .left-panel details.section>summary:after{content:"＋";color:#49806f}
body[data-mimi-tool="roll-call"] .left-panel details.section[open]>summary:after{content:"−"}
body[data-mimi-tool="roll-call"] .left-panel details.section[open]>summary{margin-bottom:12px}
body[data-mimi-tool="roll-call"] .right-panel .panel-body>.label{padding:14px 13px;border:2px dashed #9fc4b6;border-radius:14px;background:#e7f5ed;align-items:center}
body[data-mimi-tool="roll-call"] .right-panel .panel-body>.label strong{font-size:24px;color:#267460}
body[data-mimi-tool="roll-call"] .history-list{max-height:calc(100dvh - 330px);overflow:auto;padding-right:3px}
body[data-mimi-tool="roll-call"] .history-item{border:1.5px solid #c8d3ce;background:#fffefa;box-shadow:2px 2px 0 rgba(48,67,84,.08)}
body[data-mimi-tool="roll-call"] dialog{width:min(500px,calc(100% - 32px));border-radius:20px 15px 22px 17px;box-shadow:8px 10px 0 rgba(48,67,84,.2)}
body[data-mimi-tool="roll-call"] dialog::backdrop{background:rgba(20,34,31,.42);backdrop-filter:blur(2px)}
body[data-mimi-tool="roll-call"] .dialog-body{padding:20px 24px;line-height:1.8}
body[data-mimi-tool="roll-call"] .dialog-body p{margin:0}
body[data-mimi-tool="roll-call"] .dialog-body .hint{margin-top:7px}
body[data-mimi-tool="roll-call"] .dialog-actions{display:flex;justify-content:flex-end;gap:10px;padding:16px 24px;border-top:2px dashed #b9c8cd;background:#fffdf6}
@media(min-width:1101px){
 body[data-mimi-tool="roll-call"] .top-actions{margin-right:112px!important}
 body[data-mimi-tool="roll-call"] .stage{min-height:240px!important;padding:18px!important}
 body[data-mimi-tool="roll-call"] .result{padding:70px 20px 40px!important;overflow:visible!important}
 body[data-mimi-tool="roll-call"] .result #resultName{font-size:clamp(48px,5vw,78px)!important}
 /* 与做板贴右侧检查器一致：分类标签固定，仅当前内容面板滚动。 */
 body[data-mimi-tool="roll-call"] .left-panel .panel-body{overflow:hidden}
 body[data-mimi-tool="roll-call"] .roster-tabs{position:static;flex:0 0 auto;isolation:isolate;opacity:1;background-color:#dfeef3}
 body[data-mimi-tool="roll-call"] .roster-tabpage.active{flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;scrollbar-gutter:auto}
}
@media(min-width:761px) and (max-width:1100px){
 body[data-mimi-tool="roll-call"] .workspace{grid-template-columns:300px minmax(0,1fr)}

 body[data-mimi-tool="roll-call"] .left-panel .panel-head{flex:0 1 auto;min-width:0}
 body[data-mimi-tool="roll-call"] .left-panel .panel-body{flex:0 1 auto;min-width:0;max-height:690px}
 body[data-mimi-tool="roll-call"] #rosterText{flex:0 0 250px;min-height:250px}
 body[data-mimi-tool="roll-call"] .center{height:720px;min-height:620px}

}
@media(max-width:760px){
 body[data-mimi-tool="roll-call"] .brand p{font-size:12px}

 body[data-mimi-tool="roll-call"] .left-panel .panel-body{flex:0 1 auto;min-height:auto;overflow:auto}
 body[data-mimi-tool="roll-call"] .roster-tab{min-height:42px}
 body[data-mimi-tool="roll-call"] #rosterText{flex:0 0 210px;min-height:210px}

 body[data-mimi-tool="roll-call"] .spark:nth-of-type(1),body[data-mimi-tool="roll-call"] .spark:nth-of-type(3){--spark-x:-112px}
 body[data-mimi-tool="roll-call"] .spark:nth-of-type(2){--spark-x:-136px}
 body[data-mimi-tool="roll-call"] .spark:nth-of-type(4),body[data-mimi-tool="roll-call"] .spark:nth-of-type(6){--spark-x:112px}

 body[data-mimi-tool="roll-call"] .drawing .draw-progress:before,body[data-mimi-tool="roll-call"] .drawing #resultName,body[data-mimi-tool="roll-call"] .drawing .stage:before,body[data-mimi-tool="roll-call"] .reveal #resultName,body[data-mimi-tool="roll-call"] .reveal .stage:before,body[data-mimi-tool="roll-call"] .reveal .spark{animation:none!important}

</style>

<body data-mimi-tool="roll-call"><div class="shell">
<header><div class="brand"><div><h1>咪咪大王点名器</h1><p>公平随机，让每个名字都被看见</p></div></div><div class="top-actions"><a class="btn" href="../index.html">首页</a></div></header>
<main class="workspace" id="workspace" data-mobile-panel="draw">
<section class="panel left-panel left" id="leftPanel" data-workspace-panel="left" data-mobile-panel-name="setup">
<div class="panel-head"><h2>学生名单</h2><div class="panel-head-actions"><button class="btn small danger" id="clearRoster" type="button" data-tooltip="清空学生名单和点名记录" aria-label="清空学生名单和点名记录">清空</button><button class="panel-collapse" id="hideLeft" title="隐藏学生名单" aria-label="隐藏学生名单">−</button></div></div>
<div class="panel-body">
<div class="tabs roster-tabs" role="tablist" aria-label="学生名单设置"><button class="tab roster-tab active" type="button" role="tab" aria-selected="true" aria-controls="roster-tab-import" data-roster-tab="import">导入</button><button class="tab roster-tab" type="button" role="tab" aria-selected="false" aria-controls="roster-tab-filter" data-roster-tab="filter">筛选</button></div>
<div class="roster-tabpage active" id="roster-tab-import" role="tabpanel"><div class="label roster-label"><span class="roster-title">输入名单<span id="rosterCount">（0 人）</span></span><button class="roster-template-btn" id="template" type="button">Excel模板</button></div><textarea class="field" id="rosterText" placeholder="张三，男&#10;李四，男&#10;&#10;姓名和性别用中英文逗号分隔。"></textarea><div class="row"><label class="filelabel" id="upload" for="rosterFile">导入 Excel</label><input hidden type="file" id="rosterFile" accept=".xls,.xlsx,.txt,.csv,.tsv"><button class="btn primary" id="applyRoster">使用名单</button></div><div id="sheetControl" hidden><label class="label" for="sheetSelect">工作表</label><select class="field" id="sheetSelect"></select></div><div class="hint" id="importStatus" role="status"></div></div>
<div class="roster-tabpage" id="roster-tab-filter" role="tabpanel" hidden><section class="section"><div class="label"><span>点名筛选</span></div><div class="filters"><label class="control" id="modeControl">模式<select class="field" id="mode"><option value="student">学生</option><option value="group">小组</option></select></label><label class="control" id="genderControl">性别<select class="field" id="gender"><option value="all">全部</option><option value="男">男生</option><option value="女">女生</option><option value="">未填</option></select></label><label class="control" id="groupControl">小组<select class="field" id="group"><option value="all">全部</option></select></label><label class="switchline"><input type="checkbox" id="noRepeat" checked>本轮不重复</label></div></section></div>
</div></section><p class="sr-only" id="saveStatus" role="status">已自动保存</p>
<section class="panel center is-mobile-active" data-workspace-panel="center" data-mobile-panel-name="draw">
<div class="panel-head"><h2>点名</h2><span class="pill" id="poolCount">待抽 0 人</span></div>
<div class="stage"><i class="spark" aria-hidden="true"></i><i class="spark" aria-hidden="true"></i><i class="spark" aria-hidden="true"></i><i class="spark" aria-hidden="true"></i><i class="spark" aria-hidden="true"></i><i class="spark" aria-hidden="true"></i><div class="result" aria-live="polite" aria-atomic="true"><p id="resultCaption" class="sr-only">待抽取</p><div id="resultName">待抽取</div><p id="resultMeta"></p></div><div class="draw-progress" aria-hidden="true"></div></div>
<div class="draw-actions"><button class="btn accent draw" id="draw" aria-describedby="drawHint" title="空格键抽取">抽取</button><p class="sr-only" id="drawHint">按空格键抽取</p></div><div class="status" id="status" role="status">请导入名单</div>
</section>
<aside class="panel right-panel" data-workspace-panel="right" data-mobile-panel-name="history"><div class="panel-head"><h2>记录</h2><div class="panel-head-actions"><span class="pill" id="historyCount">0 次</span><button class="panel-collapse" id="hideRight" title="隐藏记录" aria-label="隐藏记录">−</button></div></div><div class="panel-body"><div class="label"><span>本轮 <strong id="roundTotal">0</strong> 人</span><button class="text-btn" id="newRound">重置</button></div><div class="row history-actions"><button class="btn small" id="undo">撤回</button><button class="btn small" id="exportHistory">导出 Excel</button></div><div class="history-list" id="historyList"></div></div></aside>
<div class="panel-resizer left" id="leftResizer" role="separator" aria-label="调整名单栏宽度" aria-orientation="vertical" tabindex="0"></div><div class="panel-resizer right" id="rightResizer" role="separator" aria-label="调整记录栏宽度" aria-orientation="vertical" tabindex="0"></div>
</main><button class="side-reveal left" id="showLeft" aria-hidden="true">学生名单</button><button class="side-reveal right" id="showRight" aria-hidden="true">点名记录</button></div>
<nav class="mobile-nav" aria-label="手机端功能导航"><button data-mobile-panel="setup">名单</button><button class="active" data-mobile-panel="draw" aria-current="page">点名</button><button data-mobile-panel="history">记录</button></nav>
<dialog id="confirmDialog" aria-labelledby="confirmTitle"><div class="panel-head"><h2 id="confirmTitle">确认操作</h2></div><div class="dialog-body"><p id="confirmText"></p><p class="hint" id="confirmHint" hidden></p></div><div class="dialog-actions"><button class="btn" id="cancel">取消</button><button class="btn danger" id="confirm">确认</button></div></dialog>
<div id="toast" hidden></div>
</body></html>
