<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light">
<title>咪咪大王点名器</title>
<link rel="icon" href="../../../assets/mimi-toolbox-transparent.ico">
<link rel="stylesheet" href="../styles/mimi-ui.css?v=4">
<style>
/* 点名页：左侧准备与筛选，中间专心抽取，右侧回看记录。 */
body[data-mimi-tool="roll-call"]{--left-w:318px;--right-w:286px}
body[data-mimi-tool="roll-call"] .brand h1{font-weight:900}
body[data-mimi-tool="roll-call"] .brand p{margin:7px 0 0;font-size:13px;font-weight:800;letter-spacing:.03em}
body[data-mimi-tool="roll-call"] .center .panel-head{background:#dff3fb}
body[data-mimi-tool="roll-call"] .center .panel-head h2:before{background:var(--blue)}
body[data-mimi-tool="roll-call"] .filters{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:13px;border:2px dashed #9fb4bd;border-radius:15px;background:#f3faf7}
body[data-mimi-tool="roll-call"] .filters .control{min-width:0}
body[data-mimi-tool="roll-call"] .filters .control:nth-child(3),body[data-mimi-tool="roll-call"] .filters .switchline{grid-column:1/-1}
body[data-mimi-tool="roll-call"] .filters .switchline{min-height:38px;padding:0 2px;white-space:nowrap}
body[data-mimi-tool="roll-call"] .stage{isolation:isolate;min-height:300px;background-color:#fffdf6;background-image:radial-gradient(circle at 18% 20%,rgba(255,201,79,.2) 0 4px,transparent 5px),radial-gradient(circle at 84% 28%,rgba(104,189,232,.2) 0 5px,transparent 6px),radial-gradient(circle at 75% 82%,rgba(50,168,137,.14) 0 4px,transparent 5px);background-size:88px 88px,116px 116px,104px 104px}
body[data-mimi-tool="roll-call"] .stage:before{content:"";position:absolute;z-index:-1;width:min(52vw,430px);aspect-ratio:1;border:3px dashed rgba(104,189,232,.45);border-radius:50%;background:radial-gradient(circle,#fff8d9 0 42%,#ffefaa 43% 58%,rgba(255,201,79,.18) 59% 68%,transparent 69%);transform:rotate(-4deg)}
body[data-mimi-tool="roll-call"] .stage:after{content:"·  随 机 点 名  ·";position:absolute;top:38px;left:50%;color:#65808f;font-size:12px;font-weight:900;letter-spacing:.18em;transform:translateX(-50%);white-space:nowrap}
body[data-mimi-tool="roll-call"] .result{position:relative;z-index:1;width:min(78%,680px);margin:auto;padding:70px 18px 44px}
body[data-mimi-tool="roll-call"] .result #resultName{color:#2e5368;text-shadow:3px 4px 0 #cceaf6;letter-spacing:.1em}
body[data-mimi-tool="roll-call"] .result #resultMeta{color:#607987;font-size:14px;font-weight:800}
body[data-mimi-tool="roll-call"] .draw-actions{position:relative;z-index:2;padding:0 clamp(42px,11vw,138px) 20px}
body[data-mimi-tool="roll-call"] .draw-actions .draw{position:relative;border-radius:18px 14px 20px 15px;box-shadow:5px 6px 0 rgba(48,67,84,.24);letter-spacing:.1em}
body[data-mimi-tool="roll-call"] .draw-actions .draw:after{content:"空格键";position:absolute;right:14px;top:50%;padding:3px 7px;border:1.5px solid currentColor;border-radius:6px;font-size:10px;letter-spacing:0;opacity:.8;transform:translateY(-50%)}
body[data-mimi-tool="roll-call"] .status{text-align:center;font-weight:800}
body[data-mimi-tool="roll-call"] .left-panel .panel-body,body[data-mimi-tool="roll-call"] .right-panel .panel-body{background:linear-gradient(180deg,#fffdf3,#fffaf0)}
body[data-mimi-tool="roll-call"] .left-panel details.section>summary{padding:10px 12px;border:2px dashed #9fb4bd;border-radius:12px;background:#fff8d7;cursor:pointer;list-style:none}
body[data-mimi-tool="roll-call"] .left-panel details.section>summary:after{content:"＋";color:#49806f}
body[data-mimi-tool="roll-call"] .left-panel details.section[open]>summary:after{content:"−"}
body[data-mimi-tool="roll-call"] .left-panel details.section[open]>summary{margin-bottom:12px}
body[data-mimi-tool="roll-call"] .student-list{max-height:calc(100dvh - 600px);overflow:auto;padding-right:3px}
body[data-mimi-tool="roll-call"] .student{border:1.5px solid #cad5d1;background:#fffefa}
body[data-mimi-tool="roll-call"] .student.called{background:#eef0e9;text-decoration:none}
body[data-mimi-tool="roll-call"] .right-panel .panel-body>.label{padding:14px 13px;border:2px dashed #9fc4b6;border-radius:14px;background:#e7f5ed;align-items:center}
body[data-mimi-tool="roll-call"] .right-panel .panel-body>.label strong{font-size:24px;color:#267460}
body[data-mimi-tool="roll-call"] .history-list{max-height:calc(100dvh - 330px);overflow:auto;padding-right:3px}
body[data-mimi-tool="roll-call"] .history-item{border:1.5px solid #c8d3ce;background:#fffefa;box-shadow:2px 2px 0 rgba(48,67,84,.08)}
@media(min-width:1101px){body[data-mimi-tool="roll-call"] .top-actions{margin-right:112px!important}body[data-mimi-tool="roll-call"] .stage{min-height:240px!important;padding:18px!important}body[data-mimi-tool="roll-call"] .result{padding:70px 20px 40px!important;overflow:visible!important}body[data-mimi-tool="roll-call"] .result #resultName{font-size:clamp(48px,5vw,78px)!important}}
@media(min-width:761px) and (max-width:1100px){body[data-mimi-tool="roll-call"] .stage{min-height:430px}body[data-mimi-tool="roll-call"] .stage:before{width:min(56vw,420px)}}
@media(max-width:760px){body[data-mimi-tool="roll-call"] .brand p{font-size:12px}body[data-mimi-tool="roll-call"] .filters{grid-template-columns:1fr 1fr}body[data-mimi-tool="roll-call"] .stage{min-height:330px;padding:12px 8px}body[data-mimi-tool="roll-call"] .stage:before{width:82vw;max-width:350px}body[data-mimi-tool="roll-call"] .stage:after{top:30px}body[data-mimi-tool="roll-call"] .result{width:92%;padding:66px 8px 38px}body[data-mimi-tool="roll-call"] .result #resultName{font-size:clamp(40px,15vw,60px)}body[data-mimi-tool="roll-call"] .draw-actions{padding:0 16px 16px}body[data-mimi-tool="roll-call"] .draw-actions .draw:after{display:none}body[data-mimi-tool="roll-call"] .student-list,body[data-mimi-tool="roll-call"] .history-list{max-height:none}}
</style>
<script defer src="../scripts/mimi-common.js?v=2"></script><script defer src="../scripts/mimi-workspace.js?v=2"></script>
</head>
<body data-mimi-tool="roll-call"><div class="shell">
<header><div class="brand"><div><h1>咪咪大王点名器</h1><p>公平随机，让每个名字都被看见</p></div></div><div class="top-actions"><a class="btn" href="../index.html">首页</a></div></header>
<main class="workspace" id="workspace" data-mobile-panel="draw">
<aside class="panel left-panel" data-workspace-panel="left" data-mobile-panel-name="setup">
<div class="panel-head"><h2>学生名单</h2><button class="panel-collapse" id="hideLeft" aria-label="收起学生名单">‹</button></div>
<div class="panel-body">
<details class="section"><summary class="label">导入名单</summary><div class="stack"><label class="label" for="rosterText">粘贴名单</label><textarea class="field" id="rosterText" rows="4" placeholder="每行一个姓名，或粘贴 Excel 三列：&#10;姓名,性别,小组"></textarea><div class="row"><button class="btn" id="upload" title="支持 XLSX、TXT、CSV、TSV，最大 5 MB">上传文件</button><button class="btn primary" id="applyRoster">使用名单</button></div><input hidden type="file" id="rosterFile" accept=".xlsx,.txt,.csv,.tsv"><button class="text-btn" id="template">下载模板</button><div id="sheetControl" hidden><label class="label" for="sheetSelect">工作表</label><select class="field" id="sheetSelect"></select></div><p class="hint" id="importStatus" role="status"></p></div></details>
<section class="section"><div class="label"><span>抽取范围</span><span class="pill">即时生效</span></div><div class="filters"><label class="control">方式<select class="field" id="mode"><option value="student">学生</option><option value="group">小组</option></select></label><label class="control">性别<select class="field" id="gender"><option value="all">全部</option><option value="男">男生</option><option value="女">女生</option><option value="">未填性别</option></select></label><label class="control">小组<select class="field" id="group"><option value="all">全部小组</option></select></label><label class="switchline"><input type="checkbox" id="noRepeat" checked>本轮已点过的同学不重复</label></div></section>
<section class="section"><div class="label"><span>班级成员</span><span id="rosterCount" class="pill">0 人</span></div><label class="sr-only" for="studentSearch">搜索姓名或小组</label><input type="search" class="field" id="studentSearch" placeholder="搜索姓名或小组"><div class="student-list" id="studentList"></div><div class="row history-actions"><button class="btn small" id="exportRoster">导出名单</button><button class="btn small danger" id="clearRoster">清空</button></div><details><summary class="text-btn">保存状态</summary><p class="hint" id="saveStatus" role="status">已开启本机自动保存</p></details></section>
</div></aside>
<section class="panel center is-mobile-active" data-workspace-panel="center" data-mobile-panel-name="draw">
<div class="panel-head"><h2>点名</h2><span class="pill" id="poolCount">待抽 0 人</span></div>
<div class="stage"><div class="result" aria-live="polite" aria-atomic="true"><p id="resultCaption" class="sr-only">等待点名</p><div id="resultName">准备点名</div><p id="resultMeta">请导入名单</p></div></div>
<div class="draw-actions"><button class="btn accent draw" id="draw" aria-describedby="drawHint" title="空格键开始点名">开始点名</button><p class="sr-only" id="drawHint">空格键开始</p></div><div class="status" id="status" role="status">请导入名单</div>
</section>
<aside class="panel right-panel" data-workspace-panel="right" data-mobile-panel-name="history"><div class="panel-head"><h2>点名记录</h2><div class="panel-head-actions"><span class="pill" id="historyCount">0 次</span><button class="panel-collapse" id="hideRight" aria-label="收起点名记录">›</button></div></div><div class="panel-body"><div class="label"><span>本轮已点 <strong id="roundTotal">0</strong> 人</span><button class="text-btn" id="newRound">新一轮</button></div><div class="row history-actions"><button class="btn small" id="undo">撤回上次</button><button class="btn small" id="exportHistory">导出记录</button></div><div class="history-list" id="historyList"></div></div></aside>
<div class="panel-resizer left" id="leftResizer" role="separator" aria-label="调整名单栏宽度" aria-orientation="vertical" tabindex="0"></div><div class="panel-resizer right" id="rightResizer" role="separator" aria-label="调整记录栏宽度" aria-orientation="vertical" tabindex="0"></div>
</main><button class="side-reveal left" id="showLeft" aria-hidden="true">学生名单</button><button class="side-reveal right" id="showRight" aria-hidden="true">点名记录</button></div>
<nav class="mobile-nav" aria-label="手机端功能导航"><button data-mobile-panel="setup">名单</button><button class="active" data-mobile-panel="draw" aria-current="page">点名</button><button data-mobile-panel="history">记录</button></nav>
<dialog id="confirmDialog" aria-labelledby="confirmTitle"><div class="panel-head"><h2 id="confirmTitle">确认操作</h2></div><div class="panel-body"><p id="confirmText"></p><div class="row"><button class="btn" id="cancel">取消</button><button class="btn accent" id="confirm">确认</button></div></div></dialog>
<div id="toast" hidden></div>
</body></html>
