<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light">
<title>咪咪大王工具箱</title>
<style>
:root{--ink:#304354;--paper:#fff9df;--cream:#fffdf3;--mint:#8ed7ca;--gold:#ffc94f;--coral:#ff785d;--blue:#68bde8;--shadow:rgba(48,67,84,.16)}*{box-sizing:border-box}html{min-width:320px;scrollbar-gutter:stable}body{margin:0;min-height:100vh;padding:28px 28px 40px;color:var(--ink);background-color:var(--paper);background-image:linear-gradient(rgba(104,189,232,.13) 1px,transparent 1px),linear-gradient(90deg,rgba(104,189,232,.08) 1px,transparent 1px);background-size:28px 28px;font-family:"YouYuan","Yuanti SC","PingFang SC","Microsoft YaHei",sans-serif;overflow-x:hidden}body:before{content:"";position:fixed;z-index:-1;left:54px;top:0;bottom:0;width:2px;background:rgba(255,120,93,.18)}main{width:min(1180px,100%);margin:auto}header{display:flex;align-items:center;gap:18px;position:relative;margin-bottom:24px;padding:0 4px}.brand-mark{position:relative;flex:0 0 86px;width:86px;height:86px;filter:drop-shadow(4px 5px 0 rgba(48,67,84,.11));animation:arrive .55s cubic-bezier(.22,1,.36,1) both}.brand-mark img{width:100%;height:100%;object-fit:contain}.brand-copy{min-width:0}.brand-copy h1{margin:0;font-size:clamp(30px,4vw,43px);line-height:1.14;letter-spacing:.07em;color:#2e5368;text-shadow:2px 2px 0 #fff,3px 3px 0 #b9dfef}.brand-copy p{margin:7px 0 0;color:#708092;font-size:14px;font-weight:800}.doodle{position:absolute;pointer-events:none}.spark{right:5%;top:9px;width:36px;color:var(--gold)}.wave{right:12%;bottom:6px;width:61px;color:var(--coral)}
.toolbox-bar{display:flex;align-items:center;gap:13px;margin-bottom:18px;padding:12px 14px;border:2px solid var(--ink);border-radius:18px 14px 20px 15px;background:rgba(255,253,243,.94);box-shadow:4px 5px 0 var(--shadow)}.search{position:relative;flex:1;min-width:150px}.search>svg{position:absolute;left:13px;top:50%;width:20px;transform:translateY(-50%);color:#617786}.search input{width:100%;min-height:44px;padding:9px 72px 9px 42px;border:2px solid #9db0ba;border-radius:13px 10px 14px 11px;background:#fffef8;color:var(--ink);font:800 15px/1.4 inherit;outline:none;transition:.18s}.search input::placeholder{color:#81939e}.search input:focus{border-color:var(--blue);box-shadow:0 0 0 4px rgba(104,189,232,.22)}.key{position:absolute;right:11px;top:50%;transform:translateY(-50%);padding:2px 7px;border:1.5px solid #aebdc5;border-radius:6px;background:#f5f1df;color:#6d7e88;font-size:12px;font-weight:900}.tool-count{flex:none;margin:0;padding:7px 11px;border-radius:20px;background:#dff5e8;color:#3d655f;font-size:13px;font-weight:900;white-space:nowrap}.tool-count strong{color:var(--ink);font-size:16px}
.tools{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr));gap:18px}.tool{--accent:var(--gold);position:relative;min-height:190px;padding:21px 22px 20px;border:2.5px solid var(--ink);border-radius:22px 17px 24px 19px;background:rgba(255,253,243,.97);color:inherit;text-decoration:none;box-shadow:5px 7px 0 var(--shadow);transition:transform .2s,box-shadow .2s,background .2s;overflow:hidden;isolation:isolate;animation:card-in .45s cubic-bezier(.22,1,.36,1) both;cursor:pointer}.tool:nth-child(4n+2){--accent:var(--mint);animation-delay:.05s}.tool:nth-child(4n+3){--accent:var(--blue);animation-delay:.1s}.tool:nth-child(4n){--accent:#ffad9d;animation-delay:.15s}.tool:after{content:"";position:absolute;z-index:-1;left:22px;right:69px;bottom:23px;height:1px;background:repeating-linear-gradient(90deg,rgba(104,189,232,.26) 0 9px,transparent 9px 15px)}.tool:hover,.tool:focus-visible{outline:none;transform:translateY(-4px) rotate(-.25deg);box-shadow:8px 11px 0 rgba(48,67,84,.15);background:#fffef8}.tool:nth-child(even):hover,.tool:nth-child(even):focus-visible{transform:translateY(-4px) rotate(.25deg)}.tool:focus-visible{box-shadow:0 0 0 5px rgba(104,189,232,.3),8px 11px 0 rgba(48,67,84,.15)}.tool:active{transform:translate(2px,2px)!important;box-shadow:2px 3px 0 var(--shadow)}.tool-top{margin-bottom:14px}.icon{width:58px;height:58px;display:grid;place-items:center;border:2.5px solid var(--ink);border-radius:17px 13px 18px 14px;background:var(--accent);box-shadow:3px 3px 0 rgba(48,67,84,.17);transform:rotate(-2deg);transition:.2s}.tool:nth-child(even) .icon{transform:rotate(2deg)}.tool:hover .icon{transform:rotate(3deg)}.tool:nth-child(even):hover .icon{transform:rotate(-3deg)}.icon svg{width:42px;height:42px}h2{margin:0 0 7px;padding-right:38px;font-size:21px;line-height:1.32}.tool p{margin:0;padding-right:31px;color:#657a89;line-height:1.6;font-size:13px;font-weight:700}.go{position:absolute;right:18px;bottom:17px;width:37px;height:37px;display:grid;place-items:center;border:2px solid var(--ink);border-radius:50%;background:var(--coral);color:#fff;box-shadow:2px 3px 0 rgba(48,67,84,.15);transition:.18s}.go svg{width:19px}.tool:hover .go{transform:translateX(3px) rotate(-4deg);background:#f5664b}.empty{display:none;margin:36px auto 0;padding:26px;text-align:center;color:#657a89;font-weight:800}.empty[aria-hidden=false]{display:block}.empty svg{display:block;width:48px;margin:0 auto 10px;color:var(--blue)}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
@keyframes arrive{from{opacity:0;transform:translateY(-8px) rotate(-3deg)}to{opacity:1;transform:none}}@keyframes card-in{from{opacity:0;transform:translateY(10px) scale(.985)}to{opacity:1;transform:none}}@media(max-width:680px){body{padding:20px 15px 28px}body:before{left:27px}header{gap:13px;margin-bottom:18px}.brand-mark{flex-basis:70px;width:70px;height:70px}.brand-copy h1{font-size:29px}.brand-copy p{font-size:12px}.doodle{display:none}.toolbox-bar{gap:9px;padding:9px}.key{display:none}.search input{padding-right:12px;font-size:16px}.tool-count{padding:7px 9px}.tools{grid-template-columns:1fr;gap:14px}.tool{min-height:172px;padding:18px}}@media(prefers-reduced-motion:reduce){.brand-mark,.tool{animation:none}.tool,.icon,.go,.search input{transition:none}}
</style></head>
<body><main>
<header><div class="brand-mark" aria-hidden="true"><img src="./assets/mimi-toolbox-transparent.ico" alt=""></div><div class="brand-copy"><h1>咪咪大王工具箱</h1><p>咪的汪给咪做的小工具</p></div><svg class="doodle spark" viewBox="0 0 48 48" aria-hidden="true"><path d="M24 3c1 12 5 17 17 19-12 2-16 7-17 20-2-13-6-18-18-20C18 20 22 15 24 3Z" fill="currentColor" stroke="#304354" stroke-width="2"/><path d="m39 6 2 6m-6-2 7-2" stroke="#304354" stroke-width="2"/></svg><svg class="doodle wave" viewBox="0 0 72 24" aria-hidden="true"><path d="M3 15c8-14 14 9 23-3s15 11 24-1 13 4 19-2" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round"/></svg></header>
<div class="toolbox-bar"><label class="search"><span class="sr-only">搜索工具</span><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="11" cy="11" r="6.5" stroke="currentColor" stroke-width="2.3"/><path d="m16 16 4 4" stroke="currentColor" stroke-width="2.3"/></svg><input id="tool-search" type="search" placeholder="搜索工具……" autocomplete="off"><span class="key" aria-hidden="true">/</span></label><p class="tool-count" aria-live="polite"><strong id="visible-count">2</strong> 个工具</p></div>
<section class="tools" aria-label="工具列表">
<a class="tool" data-search="排座位 座位 教室 规则 座位表" href="./咪咪大王排座位.html"><div class="tool-top"><span class="icon" aria-hidden="true"><svg viewBox="0 0 56 56" fill="none"><path d="M13 11h30v17H13z" fill="#FFFDF3" stroke="#304354" stroke-width="2.7"/><path d="M17 16h22M17 22h22" stroke="#68BDE8" stroke-width="2"/><path d="M9 32h15v12H9zm23 0h15v12H32z" fill="#DFF5E8" stroke="#304354" stroke-width="2.7"/><path d="M12 44v5m9-5v5m14-5v5m9-5v5" stroke="#304354" stroke-width="2.7"/><circle cx="16.5" cy="38" r="2" fill="#FF785D"/><circle cx="39.5" cy="38" r="2" fill="#FF785D"/></svg></span></div><h2>咪咪大王排座位</h2><p>安排座位、设置规则，一键生成清楚好看的教室座位表。</p><span class="go" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path d="M5 12h13m-5-5 5 5-5 5" stroke="currentColor" stroke-width="2.5"/></svg></span></a>
<a class="tool" data-search="做板贴 板贴 文字 图片 打印" href="./咪咪大王做板贴.html"><div class="tool-top"><span class="icon" aria-hidden="true"><svg viewBox="0 0 56 56" fill="none"><path d="M28 7v42" stroke="#304354" stroke-width="2.7"/><path d="M28 17 41 8l7 10-20 13" fill="#FFFDF3" stroke="#304354" stroke-width="2.7"/><path d="m28 29-13-9-7 10 20 13" fill="#DFF4FF" stroke="#304354" stroke-width="2.7"/><path d="M36 17h6M14 29h6" stroke="#FF785D" stroke-width="2.5"/><circle cx="28" cy="30" r="4" fill="#FFC94F" stroke="#304354" stroke-width="2.5"/></svg></span></div><h2>咪咪大王做板贴</h2><p>组合文字与图片，制作并导出适合打印的课堂板贴。</p><span class="go" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path d="M5 12h13m-5-5 5 5-5 5" stroke="currentColor" stroke-width="2.5"/></svg></span></a>
</section><div class="empty" id="empty-state" aria-hidden="true"><svg viewBox="0 0 48 48" fill="none" aria-hidden="true"><path d="M9 13h30v25H9z" fill="#fffdf3" stroke="currentColor" stroke-width="2.5"/><path d="m17 10 7 6 7-6M17 27h14" stroke="currentColor" stroke-width="2.5"/></svg>没有找到这个工具，换个词试试吧。</div>
</main><script>
const search=document.querySelector('#tool-search'),tools=[...document.querySelectorAll('.tool')],count=document.querySelector('#visible-count'),empty=document.querySelector('#empty-state');function filterTools(){const query=search.value.trim().toLocaleLowerCase('zh-CN');let visible=0;tools.forEach(tool=>{const matches=!query||`${tool.textContent} ${tool.dataset.search||''}`.toLocaleLowerCase('zh-CN').includes(query);tool.hidden=!matches;if(matches)visible+=1});count.textContent=visible;empty.setAttribute('aria-hidden',String(visible!==0))}search.addEventListener('input',filterTools);document.addEventListener('keydown',event=>{if(event.key==='/'&&document.activeElement!==search){event.preventDefault();search.focus()}if(event.key==='Escape'&&document.activeElement===search){search.value='';filterTools();search.blur()}})
</script></body></html>
